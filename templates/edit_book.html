{% extends 'base.html' %}
{% block title %}Edit Book{% endblock %}
{% block content %}
<h1 class="page-title">Edit Book</h1>

<div class="form-card">
    <form method="POST" action="{{ url_for('edit_book', book_id=book.id) }}">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" value="{{ book.title }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="author">Author *</label>
            <input type="text" id="author" name="author" value="{{ book.author }}" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" value="{{ book.isbn or '' }}">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ book.category or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label for="quantity">Number of Copies</label>
            <input type="number" id="quantity" name="quantity" value="{{ book.quantity }}" min="1">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('books') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
