{% extends 'base.html' %}
{% block title %}Add Book{% endblock %}
{% block content %}
<h1 class="page-title">Add a New Book</h1>

<div class="form-card">
    <form method="POST" action="{{ url_for('add_book') }}">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" required autofocus>
        </div>
        <div class="form-group">
            <label for="author">Author *</label>
            <input type="text" id="author" name="author" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Fiction, Science">
            </div>
        </div>
        <div class="form-group">
            <label for="quantity">Number of Copies</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Book</button>
            <a href="{{ url_for('books') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
